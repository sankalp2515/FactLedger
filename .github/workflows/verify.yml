name: verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evidence_test
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U evidence -d evidence_test" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://evidence:integration-only@localhost:5432/evidence_test
      ARTIFACT_DIR: /tmp/evidence-artifacts
      MODE: development
      SESSION_SECRET: integration-only-secret-not-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c infra/requirements-runtime.lock -e '.[dev]'
      - run: ruff check apps/api tests scripts eval migrations
      - run: ruff format --check apps/api tests scripts eval migrations
      - name: Check publication paths, credential patterns and local documentation links
        run: python scripts/verify_publication.py
      - name: Validate one-command Compose entry point without provider keys
        run: docker compose config --quiet
      - run: alembic upgrade head
      - run: pytest tests -q
      - run: pytest eval/tests -q
      - name: PostgreSQL API and worker fixture journey
        run: |
          python -m uvicorn product_core.main:app --host 127.0.0.1 --port 8008 >/tmp/evidence-api.log 2>&1 &
          api_pid=$!
          python -m product_core.worker >/tmp/evidence-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8008/health/ready >/dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke_fixture.py --base-url http://127.0.0.1:8008
      - run: alembic check
      - run: python -m pip wheel --no-deps . --wheel-dir /tmp/evidence-wheels
      - name: Save fixture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-diagnostics
          path: |
            /tmp/evidence-api.log
            /tmp/evidence-worker.log
          if-no-files-found: ignore
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.0.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec tsc --noEmit && pnpm lint && pnpm test && pnpm build
        working-directory: apps/web
  compose-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: factledger-releasecheck
      APP_PORT: '18008'
      DB_PORT: '15432'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start a fresh key-free stack
        run: |
          test ! -f .env
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise fixture investigation, review, export and deletion
        run: docker compose exec -T api python scripts/smoke_fixture.py --base-url http://127.0.0.1:8000
      - name: Save Compose diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 > /tmp/compose-fixture.log
      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-fixture-diagnostics
          path: /tmp/compose-fixture.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable fixture stack
        if: always()
        run: docker compose --project-name factledger-releasecheck down --volumes
