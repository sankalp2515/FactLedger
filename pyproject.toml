[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.3.6,<4", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "pypdf>=5,<7", "pdfplumber>=0.11,<1", "python-multipart>=0.0.20,<1", "authlib>=1.5,<2", "itsdangerous>=2.2,<3", "alembic>=1.15,<2", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
